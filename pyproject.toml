[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "eva-robot"
version = "2.0.0"
description = "Edge vision-language-action software for the EVA robot"
requires-python = ">=3.9"
dependencies = [
  "Flask",
  "Flask-SocketIO",
  "matplotlib",
  "numpy",
  "opencv-python",
  "plotly",
  "requests",
  "tqdm",
]

[project.scripts]
eva = "backend.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["backend*"]
namespaces = true

[tool.setuptools.package-data]
backend = ["lib/*.pyi", "vision/*.yaml", "vision/configs/*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]

[tool.ruff]
line-length = 88
indent-width = 2
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"
